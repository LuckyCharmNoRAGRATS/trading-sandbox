function fmt(k, v) {
  if (typeof v === 'number') {
    if (/conf|rate|acc/.test(k) && v <= 1) return Math.round(v * 100) + '%';
    return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
  }
  return esc(typeof v === 'object' ? JSON.stringify(v) : v);
}

function pill(t) {
  const key = String(t || '').toUpperCase();

  return '<span class="font-mono text-xs px-2 py-0.5 rounded border ' + cls + '">' + esc(t) + '</span>';
}

function empty(m) {

}

function card(h, b, x) {
  const headerHtml = h ? '<h2 class="font-semibold mb-3 flex items-center justify-between">' + h + '</h2>' : '';
  return '<section class="bg-panel border border-edge rounded-lg p-4 ' + (x || '') + '">' + headerHtml + b + '</section>';
}

function grid(o) {
  const entries = Object.entries(o || {});
  if (!entries.length) return '';
  const items = entries.map(function(pair) {
    const k = pair[0], v = pair[1];
    return '<div class="bg-ink/60 border border-edge/60 rounded p-2.5">' +
      '<dt class="text-mute text-[11px]">' + esc(k.replace(/_/g, ' ')) + '</dt>' +
      '<dd class="font-mono text-xs sm:text-sm mt-0.5">' + fmt(k, v) + '</dd>' +
    '</div>';
  }).join('');
  return '<dl class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">' + items + '</dl>';
}

function stat(l, v, s) {

// ============================================================================
let chartObj = null, priceSeries = null, upperSeries = null, lowerSeries = null;

function mountRealtimeChart() {
  const container = document.getElementById('tvchart');
  if (!container) return;
  if (typeof LightweightCharts === 'undefined') {
    container.innerHTML = '<div class="p-6 text-center text-mute font-mono text-xs">Chart library loading or blocked by browser tracking prevention.</div>';
    return;
  }
  try {
    container.innerHTML = '';
    chartObj = LightweightCharts.createChart(container, {
      width: container.clientWidth || 600,
      height: 320,
      layout: { background: { type: 'solid', color: '#0b1220' }, textColor: '#8b9ab5', fontFamily: 'IBM Plex Mono' },
      grid: { vertLines: { color: '#162238' }, horzLines: { color: '#162238' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#1f2c44' },
      timeScale: { borderColor: '#1f2c44', timeVisible: true, secondsVisible: true }
    });

    priceSeries = chartObj.addAreaSeries({
      lineColor: '#39ff88',
      topColor: 'rgba(57, 255, 136, 0.22)',
      bottomColor: 'rgba(57, 255, 136, 0.01)',
      lineWidth: 2,
      title: S.chartTicker
    });

    upperSeries = chartObj.addLineSeries({
      color: 'rgba(77, 163, 255, 0.55)',
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      title: '+2s Upper'
    });

    lowerSeries = chartObj.addLineSeries({
      color: 'rgba(255, 179, 71, 0.55)',
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      title: '-2s Lower'
    });

    updateChartSeriesData();
  } catch (err) {
    console.error('Chart mount error:', err);
  }
}

window.addEventListener('resize', function() {
  const container = document.getElementById('tvchart');
  if (chartObj && container) {
    chartObj.applyOptions({ width: container.clientWidth });
  }
});

function updateChartSeriesData() {
  if (!priceSeries) return;
  try {
    const key = S.chartTicker === 'GLD/GDX' ? 'GLD_GDX' : S.chartTicker;
    const data = S.ticks[key] || S.ticks.AAPL;
    priceSeries.setData(data);

    const upper = [], lower = [];
    const bandOffset = key === 'GLD_GDX' ? 0.22 : (key === 'AAPL' ? 1.85 : 2.40);
    data.forEach(function(pt, idx) {
      const slice = data.slice(Math.max(0, idx - 19), idx + 1);
      const mean = slice.reduce(function(a, b) { return a + b.value; }, 0) / slice.length;
      upper.push({ time: pt.time, value: Number((mean + bandOffset).toFixed(3)) });
      lower.push({ time: pt.time, value: Number((mean - bandOffset).toFixed(3)) });
    });
    upperSeries.setData(upper);
    lowerSeries.setData(lower);

    if (data.length > 30 && typeof priceSeries.setMarkers === 'function') {
      const m1 = data[data.length - 28];
      const m2 = data[data.length - 9];
      priceSeries.setMarkers([
        { time: m1.time, position: 'belowBar', color: '#39ff88', shape: 'arrowUp', text: 'BUY (Z < -2.0)' },
        { time: m2.time, position: 'aboveBar', color: '#ff5c7a', shape: 'arrowDown', text: 'SHORT (Z > +2.0)' }
      ]);
    }
  } catch (err) {
    console.warn('Chart update warning:', err);
  }
}

  if (tabsEl) {
    tabsEl.innerHTML = TABS.map(function(pair) {
      const k = pair[0], l = pair[1];

    }).join('');

});

function bindForms() {
  const ordForm = $('#alpacaOrderForm');
  if (ordForm) {
    ['ordEntry', 'ordStop', 'ordSym', 'ordSide', 'ordQty'].forEach(function(id) {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function() {
          S.orderTicket.symbol = $('#ordSym').value.toUpperCase();
          S.orderTicket.side = $('#ordSide').value;
          S.orderTicket.entry_price = parseFloat($('#ordEntry').value) || 0;
          S.orderTicket.stop_loss = parseFloat($('#ordStop').value) || 0;
          S.orderTicket.qty = parseInt($('#ordQty').value, 10) || 0;
        });
      }
    });
    ordForm.addEventListener('submit', function(e) {
      e.preventDefault();
      send('submit_order', {
        symbol: $('#ordSym').value.toUpperCase().trim(),
        side: $('#ordSide').value,
        entry_price: parseFloat($('#ordEntry').value) || 0,
        stop_loss: parseFloat($('#ordStop').value) || 0,
        qty: parseInt($('#ordQty').value, 10) || 0,
        strategy: 'Manual Web/Mobile OMS'
      });
    });
  }

  const pForm = $('#paramEditForm');
  if (pForm) {
    pForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const newParams = {
        z_entry_threshold: parseFloat($('#pZ').value) || 2.0,
        bb_window: parseInt($('#pWin').value, 10) || 20,
        max_risk_per_trade: parseFloat($('#pRisk').value) || 0.01,
        stop_loss_pct: parseFloat($('#pStop').value) || 0.02,
        max_daily_drawdown: parseFloat($('#pDD').value) || 0.03,
        poll_seconds: parseInt($('#pPoll').value, 10) || 30
      };
      S.kv.risk = Object.assign({}, S.kv.risk || {}, newParams);
      send('update_params', newParams);
    });
  }

  const search = $('#sheetSearch');
  if (search) {
    search.addEventListener('input', function(e) {
      S.sheetFilter = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const s2 = $('#sheetSearch');
      if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); }
    });
  }

  const stratSel = $('#sheetStratSelect');
  if (stratSel) {
    stratSel.addEventListener('change', function(e) {
      S.sheetStrategy = e.target.value;
      render();
    });
  }

  document.querySelectorAll('[data-noteid]').forEach(function(inp) {
    inp.addEventListener('change', function(e) {
      const row = S.trades.find(function(t) { return t.id === inp.dataset.noteid; });
      if (row) {
        row.notes = e.target.value;
        toast('Saved note for ' + row.id);
      }
    });
  });
}

function simulateLiveExecution() {
  const aaplLast = S.ticks.AAPL[S.ticks.AAPL.length - 1].value;
  const spyLast = S.ticks.SPY[S.ticks.SPY.length - 1].value;
  const syms = [
    { t: 'AAPL', strat: 'Bollinger Mean Reversion', reg: 'MEAN_REVERT (H=0.44)', px: aaplLast },
    { t: 'SPY', strat: 'SMA 20/50 + ML Meta-Label', reg: 'TRENDING (H=0.55)', px: spyLast },
    { t: 'GLD/GDX', strat: 'Engle-Granger Pairs (Chan Ch.7)', reg: 'COINTEGRATED (p=0.012)', px: 185.40 }
  ];
  const pick = syms[Math.floor(Math.random() * syms.length)];
  const side = Math.random() > 0.45 ? 'BUY' : 'SELL_SHORT';
  const qty = Math.floor(40 + Math.random() * 110);
  const z = Number(((Math.random() * 1.2 + 1.9) * (side === 'BUY' ? -1 : 1)).toFixed(2));
  const conf = Number((0.62 + Math.random() * 0.28).toFixed(2));
  const pnl = Number(((Math.random() - 0.32) * 420).toFixed(2));
  const id = 'ORD-' + (9042 + S.trades.length);
  const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);

  S.trades.unshift({
    id: id, ts: nowStr, ticker: pick.t, strategy: pick.strat, regime: pick.reg,
    side: side, qty: qty, entry: Number(pick.px.toFixed(2)), exit: Number((pick.px + (pnl / qty)).toFixed(2)),
    stop: Number((pick.px * 0.985).toFixed(2)), z_score: z, ai_conf: conf, slippage_bps: 4.0, pnl: pnl, status: 'CLOSED',
    notes: 'Auto-logged from live execution stream'
  });

  S.kv.account.buying_power = Number((S.kv.account.buying_power + pnl).toFixed(2));
  S.kv.account.daily_pnl = Number(((S.kv.account.daily_pnl || 0) + pnl).toFixed(2));

  S.logs.push({
    ts: new Date().toISOString(),
    level: 'INFO',
    source: 'exec',
    msg: id + ': ' + side + ' ' + qty + ' ' + pick.t + ' @ $' + pick.px.toFixed(2) + ' | Z=' + z + 's | Net P&L: $' + pnl.toFixed(2)
  });
  toast('Executed ' + id + ': ' + side + ' ' + qty + ' ' + pick.t);
  render();
}

function exportToCSV() {
  const headers = ['Order_ID', 'Timestamp_UTC', 'Ticker', 'Strategy', 'Regime', 'Side', 'Qty', 'Entry_Price', 'Exit_Price', 'Z_Score', 'Net_PnL_USD', 'Status', 'Notes'];
  const csvRows = [headers.join(',')];
  S.trades.forEach(function(r) {
    const vals = [
      r.id, r.ts, r.ticker, '"' + (r.strategy || '') + '"', '"' + (r.regime || '') + '"',
      r.side, r.qty, r.entry, r.exit, r.z_score, r.pnl, r.status,
      '"' + String(r.notes || '').replace(/"/g, '""') + '"'
    ];
    csvRows.push(vals.join(','));
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trading_sandbox_executions_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported execution spreadsheet to .CSV');
}

async function send(cmd, args) {
  S.logs.push({ ts: new Date().toISOString(), level: 'INFO', source: 'web', msg: 'Command ' + cmd + ' -> ' + JSON.stringify(args) });
  if (cmd === 'toggle' && args.ticker && S.signals[args.ticker]) {
    S.signals[args.ticker].enabled = args.enabled;
  }

  const isPlaceholder = !CFG.url || CFG.url.includes('YOUR-PROJECT') || !CFG.key || CFG.key.includes('YOUR_ANON_KEY') || !sb;
  if (isPlaceholder) {
    if (cmd === 'submit_order') {
      const bp = S.kv.account.buying_power || 400000;
      const riskShare = Math.abs((args.entry_price || 319) - (args.stop_loss || 313)) || 5;
      const qty = args.qty > 0 ? args.qty : Math.floor((bp * 0.01) / riskShare);
      const id = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
      S.kv.alpaca_positions.positions.unshift({
        symbol: args.symbol, qty: qty, side: args.side === 'BUY' ? 'long' : 'short',
        avg_entry_price: args.entry_price, current_price: args.entry_price,
        market_value: qty * args.entry_price, unrealized_pl: 0, unrealized_plpc: 0
      });
      S.kv.alpaca_orders.orders.unshift({
        id: id, full_id: id, symbol: args.symbol, side: args.side, qty: qty,
        filled_avg_price: args.entry_price, status: 'FILLED', type: 'MARKET', created_at: new Date().toISOString()
      });
      S.trades.unshift({
        id: id, ts: new Date().toISOString().replace('T', ' ').slice(0, 19),
        ticker: args.symbol, strategy: args.strategy || 'Manual OMS', regime: 'MANUAL_OMS', side: args.side,
        qty: qty, entry: args.entry_price, exit: args.entry_price, z_score: 0, pnl: 0, status: 'FILLED', notes: 'Routed from Web/Mobile OMS'
      });
    } else if (cmd === 'close_position') {
      S.kv.alpaca_positions.positions = S.kv.alpaca_positions.positions.filter(function(p) { return p.symbol !== args.symbol; });
    }
    render();
    return toast('Executed [' + cmd + '] in Sandbox Mode');
  }

  try {
    const res = await sb.from('commands').insert({ cmd: cmd, args: args, source: 'web' });
    toast(res.error ? res.error.message : 'Sent ' + cmd + ' to Cloud VM & Alpaca');
  } catch (err) {
    toast('Error sending command: ' + err.message);
  }
}

document.addEventListener('click', function(e) {
  const b = e.target.closest('[data-cmd]');
  if (b) {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    send(b.dataset.cmd, JSON.parse(b.dataset.args || '{}'));
    return;
  }

  const cp = e.target.closest('[data-closepos]');
  if (cp) {
    const sym = cp.dataset.closepos;
    if (confirm('Close open Alpaca position for ' + sym + '?')) send('close_position', { symbol: sym });
    return;
  }

  const co = e.target.closest('[data-cancelord]');
  if (co) {
    send('cancel_order', { order_id: co.dataset.cancelord });
    return;
  }

  const tk = e.target.closest('[data-ticker]');
  if (tk) { S.chartTicker = tk.dataset.ticker; render(); return; }

  const cf = e.target.closest('[data-chanfilter]');
  if (cf) { S.chanFilter = cf.dataset.chanfilter; render(); return; }

  const bp = e.target.closest('[data-blueprint]');
  if (bp) {
    const item = S.chanFeed.find(function(x) { return x.id === bp.dataset.blueprint; });
    if (item) {
      $('#modalTitle').textContent = item.id + ' · ' + item.title;
      $('#modalBody').innerHTML =
        '<div class="text-xs font-mono text-warn">' + esc(item.chanRef) + ' · Source: ' + esc(item.source) + '</div>' +
        '<p class="text-slate-300 text-sm">' + esc(item.summary) + '</p>' +
        '<div class="bg-ink border border-edge rounded p-3 font-mono text-xs text-neon overflow-x-auto"><pre>' + esc(item.code) + '</pre></div>' +
        '<div class="flex justify-end gap-2 pt-2">' +
          '<button id="deployBlueprintBtn" data-id="' + item.id + '" class="font-mono text-xs px-4 py-2 rounded bg-neon/20 border border-neon text-neon hover:bg-neon/30">Activate Strategy in Sandbox Monitor</button>' +
        '</div>';
      $('#modal').classList.remove('hidden');
    }
    return;
  }

  const dbp = e.target.closest('#deployBlueprintBtn');
  if (dbp) {
    const item = S.chanFeed.find(function(x) { return x.id === dbp.dataset.id; });
    if (item) {
      S.signals[item.id] = {
        ticker: item.id,
        strategy: item.title.slice(0, 38) + '…',
        status: 'WATCHING',
        enabled: true,
        metrics: item.metrics
      };
      $('#modal').classList.add('hidden');
      toast('Deployed ' + item.id + ' into Active Strategy Monitor');
      location.hash = '#overview';
      render();
    }
    return;
  }

  if (e.target.closest('#closeModal') || e.target.id === 'modal') {
    $('#modal').classList.add('hidden');
    return;
  }

  if (e.target.closest('#skipLogin')) {
    $('#login').classList.add('hidden');
    setConn('demo');
    return;
  }

  const sortTh = e.target.closest('[data-sort]');
  if (sortTh) {
    const col = sortTh.dataset.sort;
    if (S.sheetSortCol === col) S.sheetSortAsc = !S.sheetSortAsc;
    else { S.sheetSortCol = col; S.sheetSortAsc = false; }
    render();
    return;
  }

  if (e.target.closest('#exportCsvBtn')) { exportToCSV(); return; }
  if (e.target.closest('#simExecBtn') || e.target.closest('#addSimRowBtn')) { simulateLiveExecution(); return; }

  if (e.target.closest('#pullChanBtn')) {
    S.chanFeed.unshift({
      id: 'CHAN-0' + (S.chanFeed.length + 1),
      source: 'SSRN / epchan.blogspot.com Alert',
      url: 'https://www.ssrn.com',
      category: 'MEAN_REVERSION',
      title: 'PCA Statistical Factor Arbitrage on S&P 500 Sector ETFs (XLF / XLK / XLE)',
      chanRef: 'Ernest Chan · Chapter 7 (Factor Models & Principal Component Analysis)',
      published: 'Just now',
      metrics: { sharpe: 2.28, half_life: '6.4 Days', adf_p: 0.009, hurst: 0.40, friction_bps: 5 },
      summary: 'Extracts top 3 statistical eigenvectors across S&P sector ETFs via Principal Component Analysis. Residual spreads exceeding 2.2s revert within a 6.4-day half-life.',
      formula: 'R = X*b + u   |   Residual Z = u / sigma(u)',
      code: '# PCA Factor Residual Mean Reversion\nfrom sklearn.decomposition import PCA\npca = PCA(n_components=3).fit(returns_matrix)'
    });
    toast('New Quantitative Strategy Alert pulled from SSRN / Chan Feed!');
    render();
    return;
  }

  if (e.target.closest('#simToggle')) {
    S.simActive = !S.simActive;
    const toggleBtn = $('#simToggle');
    toggleBtn.textContent = S.simActive ? '● Stream: ON' : '○ Stream: PAUSED';
    toggleBtn.className = S.simActive
      ? 'font-mono text-xs px-2.5 py-1 rounded border border-neon/50 bg-neon/10 text-neon'
      : 'font-mono text-xs px-2.5 py-1 rounded border border-edge text-mute';
    return;
  }
});

setInterval(function() {
  if (!S.simActive) return;
  const now = Math.floor(Date.now() / 1000);
  ['AAPL', 'SPY', 'GLD_GDX'].forEach(function(k) {
    const arr = S.ticks[k];
    const last = arr[arr.length - 1];
    const step = k === 'GLD_GDX' ? (Math.random() - 0.5) * 0.04 : (Math.random() - 0.495) * 0.35;
    const nextVal = Number((last.value + step).toFixed(k === 'GLD_GDX' ? 3 : 2));
    arr.push({ time: Math.max(now, last.time + 1), value: nextVal });
    if (arr.length > 180) arr.shift();
  });

  const aaplPx = S.ticks.AAPL[S.ticks.AAPL.length - 1].value;
  const z = Number(((aaplPx - 316.40) / 1.55).toFixed(3));
  if (S.signals.AAPL) {
    S.signals.AAPL.metrics.close = aaplPx;
    S.signals.AAPL.metrics.z_score = z;
    S.signals.AAPL.status = Math.abs(z) >= 2.0 ? 'ACTIVE' : 'NO SIGNAL';
  }

  if (Math.random() < 0.25) {
    S.logs.push({
      ts: new Date().toISOString(),
      level: Math.abs(z) >= 2.15 ? 'WARNING' : 'INFO',
      source: 'bot',
      msg: '[AAPL] Close: $' + aaplPx.toFixed(2) + ' | Z-Score: ' + z + 's | Hurst: 0.442'
    });
    if (S.logs.length > 200) S.logs.shift();
    const lb = $('#logbox');
    if (lb) {
      lb.innerHTML = renderLogLines();
      lb.scrollTop = lb.scrollHeight;
      const lc = $('#logCount');
      if (lc) lc.textContent = S.logs.length + ' lines';
    }
  }

  if (tab === 'overview' && priceSeries) {
    updateChartSeriesData();
    const lp = $('#livePx');
    if (lp) {
      const key = S.chartTicker === 'GLD/GDX' ? 'GLD_GDX' : S.chartTicker;
      const v = S.ticks[key][S.ticks[key].length - 1].value;
      lp.textContent = S.chartTicker === 'GLD/GDX' ? v.toFixed(3) : '$' + v.toFixed(2);
    }
  }
}, 1500);

// ============================================================================
// 8. FAIL-SAFE INITIALIZATION (Render First, Supabase Second)
// ============================================================================
async function load() {
  if (!sb) return;
  try {
    const res = await Promise.all([
      sb.from('kv').select('*'),
      sb.from('signals').select('*'),
      sb.from('results').select('*').order('created_at', { ascending: false }).limit(50),
      sb.from('logs').select('*').order('id', { ascending: false }).limit(200),
      sb.from('commands').select('*').order('id', { ascending: false }).limit(30)
    ]);
    const kv = res[0], sg = res[1], rs = res[2], lg = res[3], cm = res[4];
    (kv.data || []).forEach(function(r) { S.kv[r.key] = r.data; });
    (sg.data || []).forEach(function(r) { S.signals[r.ticker] = r; });
    if (rs.data && rs.data.length) {
      S.results = rs.data;
      const ledgerRows = rs.data.filter(function(x) { return x.kind === 'TRADE_LEDGER'; }).map(function(x) { return x.metrics; });
      if (ledgerRows.length) S.trades = ledgerRows;
    }
    if (lg.data && lg.data.length) S.logs = lg.data.reverse();
    if (cm.data && cm.data.length) S.commands = cm.data;
    render();
  } catch (err) {
    console.warn('Supabase load fallback:', err);
  }
}

function subscribe() {
  if (!sb) return;
  sb.channel('sandbox').on('postgres_changes', { event: '*', schema: 'public' }, function(p) {
    if (p.eventType === 'DELETE') return;
    const r = p.new, t = p.table;
    if (t === 'kv') S.kv[r.key] = r.data;
    else if (t === 'signals') S.signals[r.ticker] = r;
    else if (t === 'results') {
      S.results = [r].concat(S.results).slice(0, 50);
      if (r.kind === 'TRADE_LEDGER' && r.metrics) S.trades.unshift(r.metrics);
    }
    else if (t === 'logs') S.logs = S.logs.concat([r]).slice(-200);
    else if (t === 'commands') {
      const i = S.commands.findIndex(function(c) { return c.id === r.id; });
      if (i < 0) S.commands.unshift(r); else S.commands[i] = r;
      if (r.status === 'done' || r.status === 'error') toast(r.cmd + ': ' + r.status);
    }
    render();
  }).subscribe(function(s) {
    setConn(s === 'SUBSCRIBED' ? 'live' : 'offline');
    if (s === 'SUBSCRIBED') load();
  });
}

async function start() {
  $('#login').classList.add('hidden');
  $('#signout').classList.remove('hidden');
  await load();
  subscribe();
}

async function init() {
  // 1. Always render the UI immediately so the screen is never blank
  render();

  // 2. Check if using placeholder keys
  const isPlaceholder = !CFG.url || CFG.url.includes('YOUR-PROJECT') || !CFG.key || CFG.key.includes('YOUR_ANON_KEY');
  if (isPlaceholder || typeof supabase === 'undefined') {
    setConn('demo');
    return;
  }

  // 3. Connect to Supabase safely
  try {
    sb = supabase.createClient(CFG.url, CFG.key);
    const sessionRes = await sb.auth.getSession();
    const session = sessionRes && sessionRes.data ? sessionRes.data.session : null;
    if (session) {
      start();
    } else {
      $('#login').classList.remove('hidden');
    }
    $('#lf').addEventListener('submit', async function(e) {
      e.preventDefault();
      const authRes = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
      if (authRes.error) $('#lerr').textContent = authRes.error.message;
      else start();
    });
    $('#signout').addEventListener('click', async function() {
      await sb.auth.signOut();
      location.reload();
    });
  } catch (err) {
    console.error('Supabase init fallback:', err);
    setConn('demo');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
