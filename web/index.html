initSeedData();

const TABS=[
  ['overview','1 · Live Graph & Log'],
  ['alpaca','⚡ Alpaca Live OMS & Editor'],

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=t=>t?new Date(t).toLocaleTimeString('en-GB'):'';
const money=v=>typeof v==='number'?'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const fmt=(k,v)=>typeof v==='number'?(/conf|rate|acc/.test(k)&&v<=1?Math.round(v*100)+'%':v.toLocaleString(undefined,{maximumFractionDigits:4})):esc(typeof v==='object'?JSON.stringify(v):v);
const PILL={ACTIVE:'neon',ONLINE:'neon',FILLED:'neon',OPEN:'azure',DONE:'neon',CLOSED:'neon',WATCHING:'azure',BUY:'neon',LONG:'neon',SELL:'warn',SELL_SHORT:'warn',PAUSED:'warn',HALTED:'alert',ERROR:'alert'};
const pill=t=>{const c=PILL[String(t).toUpperCase()]||'slate-400';return `<span class="font-mono text-xs px-2 py-0.5 rounded border ${c==='slate-400'?'border-edge text-mute':`border-${c}/50 text-${c} bg-${c}/10`}">${esc(t)}</span>`};
const empty=m=>`<p class="text-mute text-sm py-4">${m}</p>`;
const card=(h,b,x='')=>`<section class="bg-panel border border-edge rounded-lg p-4 ${x}">${h?`<h2 class="font-semibold mb-3 flex items-center justify-between">${h}</h2>`:''}${b}</section>`;
const grid=o=>Object.keys(o||{}).length?`<dl class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">${Object.entries(o).map(([k,v])=>`<div class="bg-ink/60 border border-edge/60 rounded p-2"><dt class="text-mute text-[11px]">${esc(k.replace(/_/g,' '))}</dt><dd class="font-mono text-xs sm:text-sm mt-0.5">${fmt(k,v)}</dd></div>`).join('')}</dl>`:'';
const stat=(l,v,s='')=>card('',`<div class="text-mute text-xs uppercase tracking-wider">${l}</div><div class="mt-1 font-mono text-xl sm:text-2xl font-semibold">${v}</div><div class="text-mute text-xs mt-1">${esc(s)}</div>`);

const sigCard=s=>card('',`<div class="flex items-start justify-between gap-2"><div><span class="font-mono text-lg font-semibold text-slate-100">${esc(s.ticker)}</span> <span class="text-mute text-xs ml-1 font-mono">${esc(s.strategy)}</span></div>

let chartObj=null, priceSeries=null, upperSeries=null, lowerSeries=null;
function mountRealtimeChart(){
  const container = document.getElementById('tvchart');
  if(!container || typeof LightweightCharts === 'undefined') return;
  container.innerHTML = '';
  chartObj = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: 310,
    layout: { background: { type: 'solid', color: '#0b1220' }, textColor: '#8b9ab5', fontFamily: 'IBM Plex Mono' },
    grid: { vertLines: { color: '#162238' }, horzLines: { color: '#162238' } },
    rightPriceScale: { borderColor: '#1f2c44' },
    timeScale: { borderColor: '#1f2c44', timeVisible: true, secondsVisible: true }
  });
  priceSeries = chartObj.addAreaSeries({ lineColor: '#39ff88', topColor: 'rgba(57, 255, 136, 0.20)', bottomColor: 'rgba(57, 255, 136, 0.01)', lineWidth: 2 });
  upperSeries = chartObj.addLineSeries({ color: 'rgba(77, 163, 255, 0.55)', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed });
  lowerSeries = chartObj.addLineSeries({ color: 'rgba(255, 179, 71, 0.55)', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed });
  updateChartSeriesData();
}

function updateChartSeriesData(){
  if(!priceSeries) return;
  const key = S.chartTicker === 'GLD/GDX' ? 'GLD_GDX' : S.chartTicker;
  const data = S.ticks[key] || S.ticks.AAPL;
  priceSeries.setData(data);
  const upper = [], lower = [];
  const bandOffset = key === 'GLD_GDX' ? 0.22 : 1.85;
  data.forEach((pt, idx) => {
    const slice = data.slice(Math.max(0, idx-19), idx+1);
    const mean = slice.reduce((a,b)=>a+b.value,0)/slice.length;
    upper.push({time: pt.time, value: Number((mean + bandOffset).toFixed(3))});
    lower.push({time: pt.time, value: Number((mean - bandOffset).toFixed(3))});
  });
  upperSeries.setData(upper);
  lowerSeries.setData(lower);
}

let sb;
async function send(cmd,args){
  S.logs.push({ts:new Date().toISOString(), level:'INFO', source:'web', msg:`Queued '${cmd}' -> ${JSON.stringify(args)}`});

  // Instant optimistic UI update in Demo/Preview mode
  if(demo){
    if(cmd==='submit_order'){
      const bp = S.kv.account.buying_power || 400000;
      const riskShare = Math.abs((args.entry_price||319) - (args.stop_loss||313)) || 5;
      const qty = args.qty > 0 ? args.qty : Math.floor((bp * 0.01) / riskShare);
      const id = 'ORD-' + Math.floor(1000 + Math.random()*9000);
      S.kv.alpaca_positions.positions.unshift({
        symbol:args.symbol, qty, side:args.side==='BUY'?'long':'short',
        avg_entry_price:args.entry_price, current_price:args.entry_price,
        market_value:qty*args.entry_price, unrealized_pl:0, unrealized_plpc:0
      });
      S.kv.alpaca_orders.orders.unshift({
        id, full_id:id, symbol:args.symbol, side:args.side, qty,
        filled_avg_price:args.entry_price, status:'FILLED', type:'MARKET', created_at:new Date().toISOString()
      });
      S.trades.unshift({
        id, ts:new Date().toISOString().replace('T',' ').slice(0,19),
        ticker:args.symbol, strategy:args.strategy||'Manual OMS', side:args.side,
        qty, entry:args.entry_price, exit:args.entry_price, z_score:0, pnl:0, status:'FILLED', notes:'Routed from Mobile/Laptop OMS'
      });
    } else if(cmd==='close_position'){
      S.kv.alpaca_positions.positions = S.kv.alpaca_positions.positions.filter(p=>p.symbol!==args.symbol);
    }
    render();
    return toast(`✅ [${cmd}] executed (Add Supabase keys in CFG for live GCP VM routing)`);
  }

  const {error}=await sb.from('commands').insert({cmd,args,source:'web'});
  toast(error?error.message:`⚡ Sent '${cmd}' to Cloud VM & Alpaca`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cmd]');
  if(b){
    if(b.dataset.confirm&&!confirm(b.dataset.confirm))return;
    send(b.dataset.cmd,JSON.parse(b.dataset.args||'{}'));
    return;
  }
  const cp=e.target.closest('[data-closepos]');
  if(cp){
    const sym = cp.dataset.closepos;
    if(confirm(`Close open Alpaca position for ${sym}?`)) send('close_position',{symbol:sym});
    return;
  }
  const co=e.target.closest('[data-cancelord]');
  if(co){
    send('cancel_order',{order_id:co.dataset.cancelord});
    return;
  }
  const tk=e.target.closest('[data-ticker]');
  if(tk){ S.chartTicker=tk.dataset.ticker; render(); return; }
  if(e.target.closest('#simExecBtn')){
    location.hash='#alpaca';
    return;
  }
  if(e.target.closest('#exportCsvBtn')){
    const headers = ['Order_ID','Timestamp','Ticker','Strategy','Side','Qty','Entry','Exit','Z_Score','Net_PnL','Status','Notes'];
    const csv = [headers.join(','), ...S.trades.map(r=>[r.id,r.ts,r.ticker,`"${r.strategy}"`,r.side,r.qty,r.entry,r.exit,r.z_score,r.pnl,r.status,`"${r.notes||''}"`].join(','))].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download = 'alpaca_sandbox_ledger.csv';
    a.click();
    return;
  }
});

async function load(){
  const [kv,sg,rs,lg,cm]=await Promise.all([sb.from('kv').select('*'),sb.from('signals').select('*'),
    sb.from('results').select('*').order('created_at',{ascending:false}).limit(50),
    sb.from('logs').select('*').order('id',{ascending:false}).limit(200),
    sb.from('commands').select('*').order('id',{ascending:false}).limit(30)]);
  (kv.data||[]).forEach(r=>S.kv[r.key]=r.data);
  (sg.data||[]).forEach(r=>S.signals[r.ticker]=r);
  if(rs.data?.length){
    S.results=rs.data;
    const ledgerRows = rs.data.filter(x=>x.kind==='TRADE_LEDGER').map(x=>x.metrics);
    if(ledgerRows.length) S.trades = ledgerRows;
  }
  if(lg.data?.length)S.logs=lg.data.reverse();
  if(cm.data?.length)S.commands=cm.data;
  render();
}

function subscribe(){
  sb.channel('sandbox').on('postgres_changes',{event:'*',schema:'public'},p=>{
    if(p.eventType==='DELETE')return;const r=p.new,t=p.table;
    if(t==='kv')S.kv[r.key]=r.data;
    else if(t==='signals')S.signals[r.ticker]=r;
    else if(t==='results'){
      S.results=[r,...S.results].slice(0,50);
      if(r.kind==='TRADE_LEDGER' && r.metrics) S.trades.unshift(r.metrics);
    }
    else if(t==='logs')S.logs=[...S.logs,r].slice(-200);
    else if(t==='commands'){
      const i=S.commands.findIndex(c=>c.id===r.id);i<0?S.commands.unshift(r):S.commands[i]=r;
      if(r.status==='done'||r.status==='error')toast(`${r.cmd}: ${r.status}${r.result?' · '+r.result:''}`);
    }
    render();
  }).subscribe(s=>{setConn(s==='SUBSCRIBED'?'live':'offline');if(s==='SUBSCRIBED')load()});
}

async function start(){
  $('#login').classList.add('hidden');$('#signout').classList.remove('hidden');
  await load();subscribe();
}
async function init(){
  render();
  if(demo)return setConn('demo');
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data:{session}}=await sb.auth.getSession();
  session?start():$('#login').classList.remove('hidden');
  $('#lf').addEventListener('submit',async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
    error?$('#lerr').textContent=error.message:start()});
  $('#signout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});
}
init();
</script>
</body>
</html>
