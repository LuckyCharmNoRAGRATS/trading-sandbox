name: Paper evidence offline tests
on:
  pull_request:
    paths:
      - 'tools/*paper*'
      - 'tests/test_paper*.py'
      - '.github/workflows/paper-evidence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_paper*.py' -v
