name: E1 isolated regression verification

on:
  push:
    branches:
      - fix/e1-safe-execution
    paths:
      - "tests/**"
      - "dashboard_bridge.py"
      - "quant_engine.py"
      - "live_paper_trader.py"
      - ".github/workflows/e1-isolated-tests.yml"

permissions:
  contents: read

concurrency:
  group: e1-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Offline E1 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      DISCORD_WEBHOOK_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned project test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Collect tests without network access
        run: |
          PYTHONPATH=tests:. python -m pytest -p e1_network_guard --collect-only -q \
            tests/test_e1_bridge_contract.py \
            tests/test_e1_risk_contract.py \
            tests/test_e1_execution_contract.py \
            tests/test_risk_manager.py
      - name: Run offline regression suite
        if: success()
        run: |
          PYTHONPATH=tests:. python -m pytest -p e1_network_guard -q --tb=short \
            tests/test_e1_bridge_contract.py \
            tests/test_e1_risk_contract.py \
            tests/test_e1_execution_contract.py \
            tests/test_risk_manager.py
