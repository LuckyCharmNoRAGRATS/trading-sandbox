name: Congressional disclosures sync (data only)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: congress-disclosure-sync
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch and store newly disclosed trades
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      POLITICIAN_MEMBER_FILTER: Nancy Pelosi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned connector dependencies
        run: python -m pip install requests==2.34.2 supabase==2.33.0 pytest==9.1.1
      - name: Verify no-network ingestion tests
        run: python -m pytest -q tests/test_congress_ingest.py tests/test_congress_data_layer.py tests/test_tracefour_ingest.py
      - name: Validate database credentials are configured
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL secret missing'; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY" || { echo 'SUPABASE_SERVICE_KEY secret missing'; exit 1; }
      - name: Ingest new disclosures, no trade execution
        run: python congress_ingest.py --provider tracefour --member 'Nancy Pelosi'
